<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palavras - Videira Jataí</title>
    <style>
        /* ----- RESET & BASE ----- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            padding: 0 0 40px 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ----- CABEÇALHO ----- */
        .header {
            background: #600018;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-left img {
            height: 50px;
            width: auto;
            border-radius: 50%;
            background: #fff;
            padding: 4px;
        }
        .header-title { color: #fff; font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
        .header-title small { font-weight: 400; font-size: 14px; opacity: 0.85; display: block; }
        .btn-voltar {
            background: #b8860b; color: #fff; padding: 8px 18px;
            border-radius: 30px; text-decoration: none; font-weight: 600;
            font-size: 14px; transition: background 0.2s; cursor: pointer; white-space: nowrap;
        }
        .btn-voltar:hover { background: #9a7209; }

        /* ----- CONTAINER & CARDS ----- */
        .container { max-width: 820px; margin: 0 auto; padding: 20px 16px; flex: 1; width: 100%; }
        h1 {
            color: #600018; text-align: center; margin-bottom: 28px;
            font-size: 26px; border-bottom: 3px solid #b8860b; padding-bottom: 12px;
        }
        .card {
            background: #fff; border-radius: 14px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            padding: 20px 24px; margin-bottom: 20px; transition: transform 0.2s, box-shadow 0.2s;
            border-left: 6px solid #b8860b;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10); }
        .card-data { font-size: 13px; color: #718096; font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
        .card-tema { font-size: 20px; font-weight: 700; color: #1e293b; margin-bottom: 6px; }
        .card-resumo {
            font-size: 15px; color: #475569; line-height: 1.6; margin: 8px 0 14px 0;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }
        
        /* Layout dos botões nos Cards */
        .card-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
        
        .btn-ler-mais {
            background: #b8860b; color: #fff; padding: 7px 18px;
            border-radius: 30px; border: none; font-weight: 600; font-size: 13px;
            cursor: pointer; transition: background 0.2s;
        }
        .btn-ler-mais:hover { background: #9a7209; }
        
        .btn-pdf-card {
            background: #fff; color: #475569; padding: 7px 18px;
            border-radius: 30px; border: 1px solid #94a3b8; font-weight: 600; font-size: 13px;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-pdf-card:hover { background: #f1f5f9; color: #1e293b; border-color: #64748b; }
        
        .btn-youtube-card {
            background: #fff; color: #dc2626; padding: 7px 18px;
            border-radius: 30px; border: 1px solid #dc2626; font-weight: 600; font-size: 13px;
            text-decoration: none; display: inline-flex; align-items: center; transition: all 0.2s;
        }
        .btn-youtube-card:hover { background: #fee2e2; }

        /* ----- ESTADOS ----- */
        .estado-box { text-align: center; padding: 40px 20px; background: #fff; border-radius: 14px; font-size: 18px; }
        .loading { color: #475569; }
        .erro { color: #dc2626; background: #fee2e2; border: 1px solid #fecaca; }
        .sem-palavras { color: #94a3b8; }

        /* ----- MODAL ----- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); align-items: center; justify-content: center; z-index: 999; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #fff; border-radius: 16px; max-width: 720px; width: 100%;
            max-height: 90vh; padding: 24px; position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); animation: modalIn 0.3s ease; overflow-y: auto;
        }
        @keyframes modalIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-close {
            position: absolute; top: 12px; right: 18px; font-size: 30px; cursor: pointer;
            color: #334155; background: none; border: none; font-weight: 700; transition: color 0.2s;
        }
        .modal-close:hover { color: #dc2626; }
        .modal-data { font-size: 14px; color: #718096; font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
        .modal-tema { font-size: 22px; font-weight: 700; color: #1e293b; margin-bottom: 12px; }
        .modal-texto { font-size: 16px; color: #1e293b; line-height: 1.7; white-space: pre-wrap; margin-bottom: 24px; }
        
        .modal-actions {
            display: flex; flex-wrap: wrap; gap: 12px; border-top: 1px solid #e2e8f0; padding-top: 16px;
        }
        .modal-link-yt {
            display: inline-block; background: #dc2626; color: #fff; padding: 10px 24px;
            border-radius: 30px; text-decoration: none; font-weight: 600; font-size: 14px; transition: background 0.2s;
        }
        .modal-link-yt:hover { background: #b91c1c; }
        .modal-btn-pdf {
            display: inline-block; background: #475569; color: #fff; padding: 10px 24px;
            border-radius: 30px; text-decoration: none; font-weight: 600; font-size: 14px; transition: background 0.2s;
            border: none; cursor: pointer;
        }
        .modal-btn-pdf:hover { background: #334155; }

        /* ----- RODAPÉ & RESPONSIVO ----- */
        .footer { text-align: center; padding: 20px 16px; color: #94a3b8; font-size: 13px; border-top: 1px solid #e2e8f0; margin-top: 20px; }
        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: stretch; gap: 10px; }
            .header-left { justify-content: center; }
            .btn-voltar { text-align: center; width: 100%; }
            .card-actions { justify-content: flex-start; }
            .modal-actions { flex-direction: column; }
            .modal-actions a, .modal-actions button { text-align: center; width: 100%; }
        }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <img src="logo.png" alt="Logo Videira Jataí" />
            <div class="header-title">
                Igreja Videira de Jataí
                <small>Palavras e Links</small>
            </div>
        </div>
        <a href="https://videirajatai.com.br" class="btn-voltar">🏠 Voltar ao Site</a>
    </header>

    <div class="container">
        <h1>📖 Resumo das Palavras <br> <small>Pr. Gemerson Araújo </small></h1>
        <div id="lista-container">
            <div class="estado-box loading">⏳ Carregando mensagens...</div>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 Videira Jataí – Todos os direitos reservados.
    </div>

    <div class="modal-overlay" id="modalPalavra">
        <div class="modal-box">
            <button class="modal-close" id="modalFechar">&times;</button>
            <div class="modal-data" id="modalData"></div>
            <div class="modal-tema" id="modalTema"></div>
            <div class="modal-texto" id="modalTexto"></div>
            
            <div class="modal-actions" id="modalActionsContainer"></div>
        </div>
    </div>

    <script>
        // ===================================================================
        // CONFIGURAÇÕES GERAIS
        // ===================================================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxnystn3UqAKnfLUgw7tXS8CzrnpxTS0iax80rhMCRs-T47ibodGYvbRw2KRrtsnCzn/exec';
        
        let palavrasSalvas = []; 

        const container = document.getElementById('lista-container');
        const modalOverlay = document.getElementById('modalPalavra');

        // ===================================================================
        // FUNÇÕES DO MODAL
        // ===================================================================
        function abrirModal(index) {
            const palavra = palavrasSalvas[index];
            if(!palavra) return;

            document.getElementById('modalData').textContent = palavra.data || 'Data não informada';
            document.getElementById('modalTema').textContent = palavra.tema || 'Sem título';
            document.getElementById('modalTexto').textContent = palavra.texto || 'Texto não disponível';
            
            const actionsContainer = document.getElementById('modalActionsContainer');
            actionsContainer.innerHTML = ''; // Limpa botões antigos

            // 1. Botão do PDF dentro do Modal
            const btnPdf = document.createElement('button');
            btnPdf.className = 'modal-btn-pdf';
            btnPdf.innerHTML = '📄 Baixar Documento PDF';
            btnPdf.onclick = () => gerarPDF(index);
            actionsContainer.appendChild(btnPdf);

            // 2. Botão do YouTube (Se existir o link vindo da planilha)
            const urlYoutube = palavra.link || palavra.youtube || palavra.video || '';
            if (urlYoutube && urlYoutube.trim() !== '') {
                const btnYt = document.createElement('a');
                btnYt.href = urlYoutube;
                btnYt.target = '_blank';
                btnYt.className = 'modal-link-yt';
                btnYt.innerHTML = '▶ Assistir Mensagem no YouTube';
                actionsContainer.appendChild(btnYt);
            }

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden'; 
        }

        function fecharModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('modalFechar').addEventListener('click', fecharModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) fecharModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') fecharModal();
        });

        // ===================================================================
        // FUNÇÃO DE GERAÇÃO DO PDF 
        // ===================================================================
        function gerarPDF(index) {
            const palavra = palavrasSalvas[index];
            if(!palavra) return;

            // Criamos uma "página" invisível temporária só para desenhar o PDF
            const elementoPdf = document.createElement('div');
            elementoPdf.style.padding = '40px 50px';
            elementoPdf.style.fontFamily = 'Arial, Helvetica, sans-serif';
            elementoPdf.style.color = '#1e293b';
            elementoPdf.style.backgroundColor = '#ffffff';

            // Monta o visual de "Documento Oficial"
            // IMPORTANTE: Substituímos o <img> por um brasão em CSS puro no PDF.
            // Arquivos de imagem locais (.png) quebram a renderização do canvas por segurança (CORS) em vários navegadores quando abertos localmente.
            elementoPdf.innerHTML = `
                <div style="border-bottom: 3px solid #b8860b; padding-bottom: 20px; margin-bottom: 30px; height: 80px;">
                    <div style="width: 60px; height: 60px; background: #600018; border: 2px solid #b8860b; border-radius: 30px; text-align: center; line-height: 56px; color: #ffffff; font-size: 26px; font-weight: 700; font-family: Georgia, serif; margin-right: 18px; float: left;">
                        V
                    </div>
                    <div style="float: left; margin-top: 4px;">
                        <h2 style="color: #600018; margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.5px; font-family: Arial, sans-serif;">Igreja Videira de Jataí</h2>
                        <p style="color: #718096; margin: 2px 0 0 0; font-size: 13px; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; font-family: Arial, sans-serif;">Palavra • Edificação • Vida</p>
                    </div>
                    <div style="clear: both;"></div>
                </div>

                <div>
                    <div style="font-size: 11px; color: #b8860b; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px;">
                        Data da Ministração: ${palavra.data || 'Não informada'}
                    </div>
                    <h1 style="color: #1e293b; font-size: 24px; margin: 0 0 24px 0; font-weight: 700; line-height: 1.3;">
                        ${palavra.tema || 'Sem Título'}
                    </h1>
                    <div style="font-size: 14px; line-height: 1.8; text-align: justify; white-space: pre-wrap; color: #334155;">
                        ${palavra.texto || 'Texto não disponível'}
                    </div>
                </div>

                <div style="margin-top: 60px; border-top: 1px solid #e2e8f0; padding-top: 15px; text-align: center; font-size: 10px; color: #94a3b8; text-transform: uppercase;">
                    Videira Jataí — "Uma igreja de vencedores" — Documento gerado via Portal Oficial
                </div>
            `;

            // Configurações com margem inferior ainda maior para evitar cortes
            const opt = {
                margin:       [15, 15, 28, 15], // [superior, esquerda, inferior, direita]
                filename:     `Palavra - ${palavra.tema || 'Videira Jatai'}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, logging: false },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // Dispara o download tratando erros para não travar a aplicação
            html2pdf().set(opt).from(elementoPdf).save().catch(err => {
                console.error("Erro na geração do PDF: ", err);
                alert("Não foi possível processar o PDF devido às permissões do seu navegador.");
            });
        }

        // ===================================================================
        // CARREGAR DADOS DA PLANILHA
        // ===================================================================
        async function carregarPalavras() {
            try {
                const resposta = await fetch(SCRIPT_URL + '?tipo=listaPalavras');
                if (!resposta.ok) throw new Error('HTTP ' + resposta.status);
                
                const dados = await resposta.json();

                if (dados && dados.error) {
                    container.innerHTML = `<div class="estado-box erro">❌ ${dados.error}</div>`;
                    return;
                }

                if (!dados || dados.length === 0) {
                    container.innerHTML = `<div class="estado-box sem-palavras">📭 Nenhuma palavra cadastrada ainda.</div>`;
                    return;
                }

                palavrasSalvas = dados;

                // Monta os cards dinamicamente
                const htmlCards = dados.map((item, index) => {
                    const data = item.data || 'Data não informada';
                    const tema = item.tema || 'Sem tema';
                    const textoCompleto = item.texto || '';
                    
                    let resumo = textoCompleto.substring(0, 200);
                    if (textoCompleto.length > 200) resumo += '...';

                    // Mapeamento tolerante do link do YouTube vindo do GAS
                    const urlYoutube = item.link || item.youtube || item.video || '';
                    let btnYoutube = '';
                    if (urlYoutube && urlYoutube.trim() !== '') {
                        btnYoutube = `<a href="${urlYoutube}" target="_blank" class="btn-youtube-card">▶ YouTube</a>`;
                    }

                    return `
                        <div class="card">
                            <div class="card-data">${data}</div>
                            <div class="card-tema">${tema}</div>
                            <div class="card-resumo">${resumo}</div>
                            
                            <div class="card-actions">
                                <button class="btn-ler-mais" data-index="${index}">📖 Ler mais</button>
                                <button class="btn-pdf-card" data-index="${index}">📄 PDF</button>
                                ${btnYoutube}
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = htmlCards;

            } catch (erro) {
                container.innerHTML = `<div class="estado-box erro">❌ Erro ao carregar: ${erro.message}</div>`;
            }
        }

        // ===================================================================
        // CONTROLE DOS CLIQUES
        // ===================================================================
        container.addEventListener('click', function(e) {
            
            const btnLer = e.target.closest('.btn-ler-mais');
            if (btnLer) {
                const index = btnLer.getAttribute('data-index');
                abrirModal(index);
                return;
            }

            const btnPdf = e.target.closest('.btn-pdf-card');
            if (btnPdf) {
                const index = btnPdf.getAttribute('data-index');
                gerarPDF(index);
                return;
            }
        });

        // Inicia o sistema
        document.addEventListener('DOMContentLoaded', carregarPalavras);
    </script>
</body>
</html>
