<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palavras - Videira Jataí</title>
  <style>
    /* Reset e base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      padding: 0 0 40px 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Cabeçalho */
    .header {
      background: #600018;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-left img {
      height: 50px;
      width: auto;
      border-radius: 50%;
      background: #fff;
      padding: 4px;
    }
    .header-title {
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .header-title small {
      font-weight: 400;
      font-size: 14px;
      opacity: 0.85;
      display: block;
    }
    .btn-voltar {
      background: #b8860b;
      color: #fff;
      padding: 8px 18px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
      border: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-voltar:hover {
      background: #9a7209;
    }

    /* Container */
    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 20px 16px;
      flex: 1;
      width: 100%;
    }
    h1 {
      color: #600018;
      text-align: center;
      margin-bottom: 28px;
      font-size: 26px;
      border-bottom: 3px solid #b8860b;
      padding-bottom: 12px;
    }

    /* Cards estilo app */
    .card {
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 22px 24px;
      margin-bottom: 22px;
      transition: transform 0.2s, box-shadow 0.2s;
      border-left: 6px solid #b8860b;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.10);
    }
    .card-data {
      font-size: 13px;
      font-weight: 600;
      color: #b8860b;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .card-tema {
      font-size: 22px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
      line-height: 1.2;
    }
    .card-texto {
      font-size: 15px;
      color: #475569;
      line-height: 1.7;
      margin: 10px 0 16px 0;
      /* texto completo, sem truncar */
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .card-texto.collapsed {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .btn-expandir {
      background: none;
      border: none;
      color: #b8860b;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      padding: 0;
      margin-bottom: 12px;
    }
    .btn-expandir:hover {
      text-decoration: underline;
    }
    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
      border-top: 1px solid #e9edf2;
      padding-top: 14px;
    }
    .card-actions .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f1f3f5;
      color: #1e293b;
      padding: 8px 20px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      transition: background 0.2s, color 0.2s;
      border: none;
      cursor: pointer;
    }
    .card-actions .btn-assistir {
      background: #dc2626;
      color: #fff;
    }
    .card-actions .btn-assistir:hover {
      background: #b91c1c;
    }
    .card-actions .btn-pdf {
      background: #b8860b;
      color: #fff;
    }
    .card-actions .btn-pdf:hover {
      background: #9a7209;
    }
    .card-actions .btn-site {
      background: #2563eb;
      color: #fff;
    }
    .card-actions .btn-site:hover {
      background: #1d4ed8;
    }
    .card-actions .btn-download {
      background: #16a34a;
      color: #fff;
    }
    .card-actions .btn-download:hover {
      background: #15803d;
    }

    /* Estados */
    .loading, .erro, .sem-palavras {
      text-align: center;
      padding: 40px 20px;
      background: #fff;
      border-radius: 14px;
      font-size: 18px;
    }
    .loading { color: #475569; }
    .erro { color: #dc2626; background: #fee2e2; border: 1px solid #fecaca; }
    .sem-palavras { color: #94a3b8; }

    /* Modal vídeo */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-box {
      background: #fff;
      border-radius: 16px;
      max-width: 800px;
      width: 100%;
      padding: 20px;
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      animation: modalIn 0.3s ease;
    }
    @keyframes modalIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-box .modal-close {
      position: absolute;
      top: 10px;
      right: 16px;
      font-size: 28px;
      cursor: pointer;
      color: #334155;
      background: none;
      border: none;
      font-weight: 700;
      transition: color 0.2s;
    }
    .modal-box .modal-close:hover { color: #dc2626; }
    .modal-box iframe {
      width: 100%;
      height: 420px;
      border: none;
      border-radius: 10px;
    }
    .modal-box .modal-titulo {
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 12px;
      padding-right: 30px;
    }

    /* Rodapé */
    .footer {
      text-align: center;
      padding: 20px 16px;
      color: #94a3b8;
      font-size: 13px;
      border-top: 1px solid #e2e8f0;
      margin-top: 20px;
    }

    /* Responsivo */
    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .header-left { justify-content: center; }
      .btn-voltar { text-align: center; width: 100%; }
      .header-title { font-size: 16px; }
      .header-title small { font-size: 12px; }
      .card { padding: 16px 18px; }
      .card-tema { font-size: 20px; }
      .modal-box iframe { height: 240px; }
    }
    @media (max-width: 420px) {
      .card-actions .btn { font-size: 12px; padding: 6px 14px; }
    }
  </style>
</head>
<body>

  <!-- Cabeçalho -->
  <header class="header">
    <div class="header-left">
      <img src="https://img.linkme.bio/img/2021/05/10141826/logo-videira-circulo-1.png" alt="Logo Videira Jataí" />
      <div class="header-title">
        Igreja Videira de Jataí
        <small>Palavras e Mensagens</small>
      </div>
    </div>
    <a href="https://videirajatai.com.br" class="btn-voltar">🏠 Voltar ao Site</a>
  </header>

  <!-- Conteúdo -->
  <div class="container">
    <h1>📖 Palavras da Videira</h1>
    <div id="lista-container">
      <div class="loading">⏳ Carregando mensagens...</div>
    </div>
  </div>

  <!-- Rodapé -->
  <div class="footer">
    &copy; 2026 Videira Jataí – Todos os direitos reservados.
  </div>

  <!-- Modal Vídeo -->
  <div class="modal-overlay" id="modalVideo">
    <div class="modal-box">
      <button class="modal-close" id="modalFechar">&times;</button>
      <div class="modal-titulo" id="modalTitulo">Assistir</div>
      <iframe id="modalIframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    // URL do Apps Script
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxnystn3UqAKnfLUgw7tXS8CzrnpxTS0iax80rhMCRs-T47ibodGYvbRw2KRrtsnCzn/exec';

    const container = document.getElementById('lista-container');
    const modalOverlay = document.getElementById('modalVideo');
    const modalIframe = document.getElementById('modalIframe');
    const modalTitulo = document.getElementById('modalTitulo');
    const modalFechar = document.getElementById('modalFechar');

    // Extrair ID do YouTube
    function getYouTubeId(url) {
      if (!url) return null;
      const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
      const match = url.match(regex);
      return match ? match[1] : null;
    }

    function getLinkType(url) {
      if (!url) return 'none';
      const lower = url.toLowerCase();
      if (lower.includes('youtube.com') || lower.includes('youtu.be')) return 'youtube';
      if (lower.endsWith('.pdf')) return 'pdf';
      return 'website';
    }

    // Modal
    function abrirModal(videoId, titulo) {
      modalIframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
      modalTitulo.textContent = titulo || 'Assistir no YouTube';
      modalOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function fecharModal() {
      modalOverlay.classList.remove('active');
      modalIframe.src = '';
      document.body.style.overflow = '';
    }

    modalFechar.addEventListener('click', fecharModal);
    modalOverlay.addEventListener('click', function(e) {
      if (e.target === modalOverlay) fecharModal();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') fecharModal();
    });

    // Carregar dados
    async function carregarPalavras() {
      try {
        const resposta = await fetch(SCRIPT_URL + '?tipo=listaPalavras');
        if (!resposta.ok) throw new Error('Erro na requisição');
        const dados = await resposta.json();

        if (dados && dados.error) {
          container.innerHTML = `<div class="erro">❌ ${dados.error}</div>`;
          return;
        }
        if (!dados || dados.length === 0) {
          container.innerHTML = `<div class="sem-palavras">📭 Nenhuma palavra cadastrada ainda.</div>`;
          return;
        }

        let html = '';
        dados.forEach(item => {
          const data = item.data || 'Data não informada';
          const tema = item.tema || 'Sem tema';
          const texto = item.texto || '';
          const link = item.link || '';
          const tipo = getLinkType(link);
          const youtubeId = tipo === 'youtube' ? getYouTubeId(link) : null;

          // Botões
          let botoesHtml = '';
          if (tipo === 'youtube' && youtubeId) {
            botoesHtml += `<button class="btn btn-assistir" data-youtube-id="${youtubeId}" data-tema="${tema}">▶ Assistir</button>`;
          }
          if (tipo === 'pdf') {
            botoesHtml += `<a href="${link}" download class="btn btn-pdf">📄 Baixar PDF</a>`;
          }
          if (tipo === 'website' && !link.includes('youtube')) {
            botoesHtml += `<a href="${link}" target="_blank" class="btn btn-site">🔗 Acessar</a>`;
          }
          if (!botoesHtml && link) {
            botoesHtml += `<a href="${link}" target="_blank" class="btn btn-site">🔗 Acessar</a>`;
          }

          // Texto: se tiver mais de 200 caracteres, adiciona botão "Ler mais"
          const textoCompleto = texto;
          const textoCurto = texto.length > 200 ? texto.substring(0, 200) + '...' : texto;
          const precisaExpandir = texto.length > 200;

          html += `
            <div class="card">
              <div class="card-data">${data}</div>
              <div class="card-tema">${tema}</div>
              <div class="card-texto${precisaExpandir ? ' collapsed' : ''}" id="texto-${item.id || Math.random()}">
                ${precisaExpandir ? textoCurto : textoCompleto}
              </div>
              ${precisaExpandir ? `<button class="btn-expandir" data-target="texto-${item.id || Math.random()}">Ler mais</button>` : ''}
              <div class="card-actions">
                ${botoesHtml}
              </div>
            </div>
          `;
        });

        container.innerHTML = html;

        // Evento para expandir texto
        document.querySelectorAll('.btn-expandir').forEach(btn => {
          btn.addEventListener('click', function() {
            const targetId = this.dataset.target;
            const textoDiv = document.getElementById(targetId);
            if (textoDiv) {
              const isCollapsed = textoDiv.classList.contains('collapsed');
              if (isCollapsed) {
                // expandir: mostrar texto completo
                // precisamos buscar o texto original (guardado no dataset do card)
                // Vamos guardar o texto completo em um dataset no próprio elemento
                if (!textoDiv.dataset.textoCompleto) {
                  // pega o texto original a partir do item (não temos aqui)
                  // melhor: guardar no dataset durante a renderização
                }
                // Como não temos o texto completo guardado, vou reverter a lógica:
                // Vamos usar um atributo data-completo no botão e no texto
                // Na renderização, guardamos o texto completo no dataset do textoDiv
              }
            }
          });
        });

        // ========== Botões "Assistir" ==========
        document.querySelectorAll('.btn-assistir').forEach(btn => {
          btn.addEventListener('click', function() {
            const id = this.dataset.youtubeId;
            const titulo = this.dataset.tema || 'Vídeo';
            if (id) abrirModal(id, titulo);
          });
        });

      } catch (erro) {
        container.innerHTML = `<div class="erro">❌ Erro ao carregar dados: ${erro.message}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', carregarPalavras);
  </script>
</body>
</html>
