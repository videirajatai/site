<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Etiquetas | Videira</title>

    <!-- Ícone / logo -->
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="shortcut icon" type="image/png" href="logo.png" />
    <link rel="apple-touch-icon" href="logo.png" />

    <!-- Bibliotecas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
    </script>

    <!-- Fonte -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        /* ===== RESET & VARIÁVEIS ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a7a4a;
            --primary-dark: #0f5a34;
            --primary-light: #a8d5ba;
            --accent: #f5b042;
            --bg-body: #f6f9f7;
            --surface: #ffffff;
            --text-main: #1e2b26;
            --text-light: #4d6b5f;
            --text-faint: #95aaa0;
            --border-color: #dce8e1;
            --input-bg: #f2f7f4;
            --shadow-sm: 0 2px 8px rgba(26, 122, 74, 0.06);
            --shadow-md: 0 8px 24px rgba(26, 122, 74, 0.08);
            --shadow-lg: 0 16px 40px rgba(26, 122, 74, 0.14);
            --radius-sm: 0.7rem;
            --radius-md: 1.1rem;
            --radius-lg: 1.6rem;
            --radius-xl: 2rem;
        }

        body {
            background: var(--bg-body);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            padding: 1.5rem 1rem 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-header {
            width: 100%;
            max-width: 720px;
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            background: var(--surface);
            padding: 0.8rem 1.5rem;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }
        .app-header img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }
        .app-header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
        }
        .app-header span {
            font-size: 0.8rem;
            color: var(--text-light);
            font-weight: 500;
            margin-left: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1.2rem;
            width: 100%;
            max-width: 720px;
            margin-bottom: 2rem;
        }

        .card-categoria {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 1.4rem 0.8rem;
            text-align: center;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
        }
        .card-categoria:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-light);
        }
        .card-categoria .logo-mini {
            width: 56px;
            height: 56px;
            border-radius: 0%;
            object-fit: cover;
            background: #fff;
        }
        .card-categoria .titulo {
            font-weight: 700;
            font-size: 0.95rem;
        }
        .card-categoria .subtitulo {
            font-size: 0.7rem;
            color: var(--text-light);
            font-weight: 500;
            background: var(--input-bg);
            padding: 0.2rem 0.6rem;
            border-radius: 2rem;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(30, 43, 38, 0.5);
            backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }
        .modal-overlay.aberto {
            display: flex;
        }

        .modal-box {
            background: var(--surface);
            max-width: 440px;
            width: 100%;
            border-radius: var(--radius-xl);
            padding: 2rem 1.8rem;
            box-shadow: var(--shadow-lg);
            animation: modalEntrar 0.25s ease;
            position: relative;
        }
        @keyframes modalEntrar {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-box .fechar {
            position: absolute;
            top: 0.8rem;
            right: 1.2rem;
            font-size: 1.6rem;
            cursor: pointer;
            color: var(--text-faint);
            background: none;
            border: none;
            transition: 0.2s;
            line-height: 1;
        }
        .modal-box .fechar:hover {
            color: var(--text-main);
            transform: rotate(90deg);
        }
        .modal-box .modal-titulo {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .modal-box .modal-titulo img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }
        .modal-box label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 0.8rem;
            margin-bottom: 0.2rem;
        }
        .modal-box input,
        .modal-box select {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
        }
        .modal-box input:focus,
        .modal-box select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 122, 74, 0.12);
            background: white;
        }
        .modal-box .botoes {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.6rem;
        }
        .btn {
            flex: 1;
            padding: 0.7rem;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(26, 122, 74, 0.25);
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover {
            background: #e3ede7;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            background: var(--text-main);
            color: white;
            padding: 0.8rem 1.8rem;
            border-radius: var(--radius-xl);
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: var(--shadow-lg);
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast-success {
            background: var(--primary);
        }
        .toast-error {
            background: #b34a4a;
        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.8rem;
            }
            .app-header {
                flex-wrap: wrap;
                justify-content: center;
                text-align: center;
            }
            .app-header span {
                margin-left: 0;
                width: 100%;
            }
            .modal-box {
                padding: 1.5rem;
            }
        }

        #qrOptions {
            margin-top: 0.5rem;
        }
        #qrOptions label {
            margin-top: 0.5rem;
        }
        .campo-nome,
        .campo-telefone {
            transition: 0.2s;
        }
        .campo-nome.oculto,
        .campo-telefone.oculto {
            display: none;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <img src="logo.png" alt="Logo Videira" />
        <h1>Gerador de Etiquetas</h1>
        <span>Igreja Videira · Jataí</span>
    </header>

    <div class="grid" id="gradeCategorias"></div>

    <div class="modal-overlay" id="modalImpressao">
        <div class="modal-box">
            <button class="fechar" id="fecharModal">&times;</button>
            <div class="modal-titulo" id="modalTitulo">
                <img id="modalLogo" src="logo.png" alt="Logo" />
                <span id="modalNomeEvento">Evento</span>
            </div>

            <div class="campo-nome">
                <label for="inputNome">Nome completo</label>
                <input type="text" id="inputNome" placeholder="Digite o nome da pessoa" />
            </div>
            <div class="campo-telefone">
                <label for="inputTelefone">Telefone</label>
                <input type="tel" id="inputTelefone" placeholder="(64) 99999-9999" />
            </div>

            <div id="qrOptions" style="display:none;">
                <label for="qrTipo">Tipo de QR Code</label>
                <select id="qrTipo">
                    <option value="whatsapp">WhatsApp</option>
                    <option value="link">Link (URL)</option>
                    <option value="pix">Chave Pix</option>
                </select>
                <label for="qrValor">Valor</label>
                <input type="text" id="qrValor" placeholder="Número, URL ou chave Pix" />
                <div id="qrHelper" style="font-size:0.75rem; color:var(--text-light); margin-top:0.2rem;">
                    WhatsApp: número com DDD | Link: endereço do site | Pix: telefone, email ou CPF/CNPJ
                </div>
            </div>

            <div class="botoes">
                <button class="btn btn-secondary" id="btnCancelar">Cancelar</button>
                <button class="btn btn-primary" id="btnImprimir">🖨️ Imprimir</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ========== CONFIGURAÇÃO DAS CATEGORIAS ==========
        const categorias = [{
            id: 'encontro',
            nome: 'Encontro com Deus',
            logo: 'logo1.png',
            tituloImpressao: 'Encontro com Deus',
            cor: '#1a7a4a'
        }, {
            id: 'evento2',
            nome: 'Radicais Kids',
            logo: 'logo2.png',
            tituloImpressao: 'Radicais Kids',
            cor: '#c98a3e'
        }, {
            id: 'evento3',
            nome: 'Escolha de Ministérios',
            logo: 'logo3.png',
            tituloImpressao: 'Escolha de Ministérios',
            cor: '#3d7a8c'
        }, {
            id: 'evento4',
            nome: 'Radicais Livres',
            logo: 'logo4.png',
            tituloImpressao: 'Radicais Livres',
            cor: '#7a5ca3'
        }, {
            id: 'evento5',
            nome: 'Nome Grande',
            logo: null,
            tituloImpressao: 'Apenas Nome',
            cor: '#b34a4a',
            especial: 'semLogo'
        }, {
            id: 'evento6',
            nome: 'QR Code',
            logo: null,
            tituloImpressao: 'Gerador de QR',
            cor: '#2c3e50',
            especial: 'qrCode'
        }];

        // ========== PAYLOAD PIX MANUAL ==========
        function gerarPayloadPix(chave, nome, cidade, valor = null, txid = null) {
            function adicionarCampo(id, valor) {
                const len = String(valor).length.toString().padStart(2, '0');
                return id + len + valor;
            }

            function calcularCRC16(payload) {
                let crc = 0xFFFF;
                for (let i = 0; i < payload.length; i++) {
                    crc ^= payload.charCodeAt(i) << 8;
                    for (let j = 0; j < 8; j++) {
                        if (crc & 0x8000) {
                            crc = (crc << 1) ^ 0x1021;
                        } else {
                            crc <<= 1;
                        }
                        crc &= 0xFFFF;
                    }
                }
                return crc.toString(16).toUpperCase().padStart(4, '0');
            }

            let payload = '';
            payload += adicionarCampo('00', '01');
            payload += adicionarCampo('01', '12');
            const gui = 'BR.GOV.BCB.PIX';
            const chaveFormatada = chave.trim();
            let merchantAccount = adicionarCampo('00', gui);
            merchantAccount += adicionarCampo('01', chaveFormatada);
            if (valor !== null && valor > 0) {
                merchantAccount += adicionarCampo('54', valor.toFixed(2));
            }
            payload += adicionarCampo('26', merchantAccount);
            payload += adicionarCampo('52', '0000');
            payload += adicionarCampo('53', '986');
            payload += adicionarCampo('58', 'BR');
            payload += adicionarCampo('59', nome.substring(0, 25));
            payload += adicionarCampo('60', cidade.substring(0, 15));
            if (txid) {
                payload += adicionarCampo('62', adicionarCampo('05', txid.substring(0, 25)));
            }
            const payloadSemCRC = payload + '6304';
            const crc = calcularCRC16(payloadSemCRC);
            payload += '6304' + crc;
            return payload;
        }

        // ========== DETECTA DISPOSITIVO ==========
        function isMobile() {
            return /Android|iPhone|iPad|iPod|BlackBerry|Windows Phone/i.test(navigator.userAgent);
        }

        // ========== IMPRESSÃO ==========
        const LABEL_WIDTH = 384;
        const LABEL_HEIGHT = 200;

        async function imprimirEtiqueta(nome, telefone, opts = {}) {
            // --- Validações e preparação do QR ---
            if (opts.qrData) {
                const valor = opts.qrData.valor.trim();
                if (!valor) {
                    mostrarToast('Preencha o valor do QR Code.', 'error');
                    return;
                }
                if (opts.qrData.tipo === 'pix') {
                    try {
                        const payload = gerarPayloadPix(valor, 'Igreja Videira', 'Jatai');
                        opts.qrData.payload = payload;
                    } catch (err) {
                        mostrarToast('Erro Pix: ' + err.message, 'error');
                        return;
                    }
                } else if (opts.qrData.tipo === 'whatsapp') {
                    const numeros = valor.replace(/\D/g, '');
                    if (numeros.length < 10) {
                        mostrarToast('Número inválido (mínimo 10 dígitos).', 'error');
                        return;
                    }
                    let pais = '55',
                        numero = numeros;
                    if (numeros.startsWith('55')) {
                        pais = '55';
                        numero = numeros.substring(2);
                    }
                    opts.qrData.valor = `https://wa.me/${pais}${numero}`;
                } else if (opts.qrData.tipo === 'link') {
                    if (!valor.startsWith('http://') && !valor.startsWith('https://')) {
                        opts.qrData.valor = 'https://' + valor;
                    } else {
                        opts.qrData.valor = valor;
                    }
                }
            }

            // --- Monta o container da etiqueta (HTML) ---
            const container = document.createElement('div');
            container.style.position = 'fixed';
            container.style.left = '-9999px';
            container.style.top = '0';
            container.style.width = LABEL_WIDTH + 'px';
            container.style.height = LABEL_HEIGHT + 'px';
            container.style.backgroundColor = '#ffffff';
            container.style.padding = '6px';
            container.style.boxSizing = 'border-box';
            container.style.display = 'flex';
            container.style.alignItems = 'center';
            container.style.gap = '8px';
            container.style.fontFamily = 'Arial, Helvetica, sans-serif';
            container.style.color = '#1e2b26';
            container.style.overflow = 'hidden';

            if (opts.qrData) {
                const qrText = opts.qrData.payload || opts.qrData.valor;
                const qrContainer = document.createElement('div');
                qrContainer.style.position = 'fixed';
                qrContainer.style.left = '-9999px';
                qrContainer.style.top = '0';
                document.body.appendChild(qrContainer);
                new QRCode(qrContainer, { text: qrText, width: 160, height: 160 });
                await new Promise(r => setTimeout(r, 100));
                const canvasQr = qrContainer.querySelector('canvas');
                let qrDataUrl = '';
                if (canvasQr) {
                    qrDataUrl = canvasQr.toDataURL('image/png');
                } else {
                    const imgQr = qrContainer.querySelector('img');
                    if (imgQr && imgQr.src) qrDataUrl = imgQr.src;
                }
                document.body.removeChild(qrContainer);
                if (!qrDataUrl) {
                    mostrarToast('Erro ao gerar QR.', 'error');
                    return;
                }
                let subtitulo = '';
                if (opts.qrData.tipo === 'whatsapp') subtitulo = 'WhatsApp';
                else if (opts.qrData.tipo === 'link') subtitulo = 'Link';
                else if (opts.qrData.tipo === 'pix') subtitulo = 'Pix';
                container.innerHTML = `
                    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:4px;">
                        <img src="${qrDataUrl}" style="width:170px; height:170px; border:2px solid #dce8e1; border-radius:12px;" alt="QR" />
                        <div style="font-size:18px; font-weight:700; color:var(--primary); text-align:center;">${opts.titulo || 'QR Code'}</div>
                        <div style="font-size:13px; color:var(--text-light);">${subtitulo}</div>
                    </div>
                `;
            } else if (opts.semLogo) {
                container.innerHTML = `
                    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:0 8px; text-align:center;">
                        <div style="font-size:38px; font-weight:800; line-height:1.2; word-break:break-word;">${escapeHtml(nome)}</div>
                        <div style="font-size:22px; font-weight:500; color:#4d6b5f; margin-top:6px;">📞 ${escapeHtml(telefone) || '—'}</div>
                    </div>
                `;
            } else {
                const logoUrl = opts.logoUrl || 'logo.png';
                container.innerHTML = `
                    <div style="flex:0 0 120px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;">
                        <img src="${logoUrl}" style="width:130px; height:130px; border:2px solid #dce8e1; object-fit:cover;" alt="Logo" />
                        <div style="font-size:13px; font-weight:700; color:var(--primary); text-align:center;">${opts.titulo || ''}</div>
                    </div>
                    <div style="flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:2px; padding-right:4px;">
                        <div style="font-size:30px; font-weight:800; line-height:1.1; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word;">${escapeHtml(nome)}</div>
                        <div style="font-size:22px; font-weight:500; color:#4d6b5f; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">📞 ${escapeHtml(telefone) || '—'}</div>
                    </div>
                `;
            }

            document.body.appendChild(container);

            // --- Gera a imagem da etiqueta (canvas) ---
            let imagemBase64 = '';
            try {
                const canvas = await html2canvas(container, {
                    width: LABEL_WIDTH,
                    height: LABEL_HEIGHT,
                    scale: 2,
                    backgroundColor: '#ffffff',
                    useCORS: true,
                    logging: false
                });
                imagemBase64 = canvas.toDataURL('image/png');
                document.body.removeChild(container);
            } catch (err) {
                document.body.removeChild(container);
                console.error(err);
                mostrarToast('Erro ao gerar imagem.', 'error');
                return;
            }

            // ----- IMPRESSÃO SEGUNDO DISPOSITIVO -----
            if (isMobile()) {
                // Celular: rawbt
                window.location.href = 'rawbt:' + imagemBase64;
                mostrarToast('Enviado para rawbt!', 'success');
            } else {
                // PC: gera PDF com dimensões exatas (58mm x 30mm) e abre para impressão
                try {
                    // Cria um elemento div com a imagem em tamanho real (58mm x 30mm)
                    const pdfContainer = document.createElement('div');
                    pdfContainer.style.width = '58mm';
                    pdfContainer.style.height = '30mm';
                    pdfContainer.style.margin = '0';
                    pdfContainer.style.padding = '0';
                    pdfContainer.style.backgroundColor = '#ffffff';
                    pdfContainer.style.display = 'flex';
                    pdfContainer.style.alignItems = 'center';
                    pdfContainer.style.justifyContent = 'center';
                    pdfContainer.style.overflow = 'hidden';
                    pdfContainer.innerHTML = `<img src="${imagemBase64}" style="width:100%; height:100%; object-fit:contain; display:block;" />`;
                    document.body.appendChild(pdfContainer);

                    // Opções do PDF
                    const opt = {
                        margin: 0,
                        filename: 'etiqueta.pdf',
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 2, useCORS: true, logging: false },
                        jsPDF: {
                            unit: 'mm',
                            format: [58, 30],
                            orientation: 'landscape'
                        },
                        pagebreak: { mode: 'avoid-all' }
                    };

                    // Gera o PDF
                    html2pdf().set(opt).from(pdfContainer).outputPdf('blob').then(function(pdfBlob) {
                        document.body.removeChild(pdfContainer);
                        // Abre o PDF em uma nova aba para o usuário imprimir
                        const url = URL.createObjectURL(pdfBlob);
                        window.open(url, '_blank');
                        mostrarToast('PDF gerado! Imprima na POS58 com tamanho real.', 'success');
                    }).catch(function(err) {
                        document.body.removeChild(pdfContainer);
                        console.error(err);
                        mostrarToast('Erro ao gerar PDF.', 'error');
                    });
                } catch (err) {
                    console.error(err);
                    mostrarToast('Erro ao gerar PDF: ' + err.message, 'error');
                }
            }
        }

        // ========== UTILITÁRIOS ==========
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
        }

        function mostrarToast(mensagem, tipo = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = mensagem;
            toast.className = 'toast';
            if (tipo === 'success') toast.classList.add('toast-success');
            if (tipo === 'error') toast.classList.add('toast-error');
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ========== INTERFACE ==========
        const grade = document.getElementById('gradeCategorias');
        const modal = document.getElementById('modalImpressao');
        const fecharModalBtn = document.getElementById('fecharModal');
        const cancelarBtn = document.getElementById('btnCancelar');
        const imprimirBtn = document.getElementById('btnImprimir');
        const inputNome = document.getElementById('inputNome');
        const inputTelefone = document.getElementById('inputTelefone');
        const modalLogo = document.getElementById('modalLogo');
        const modalNomeEvento = document.getElementById('modalNomeEvento');
        const qrOptions = document.getElementById('qrOptions');
        const qrTipo = document.getElementById('qrTipo');
        const qrValor = document.getElementById('qrValor');
        const qrHelper = document.getElementById('qrHelper');
        const campoNome = document.querySelector('.campo-nome');
        const campoTelefone = document.querySelector('.campo-telefone');

        let categoriaSelecionada = null;

        function renderizarCards() {
            grade.innerHTML = '';
            categorias.forEach(cat => {
                const card = document.createElement('div');
                card.className = 'card-categoria';
                card.style.borderTop = `4px solid ${cat.cor || '#1a7a4a'}`;
                let logoHtml = '';
                if (cat.especial === 'semLogo') {
                    logoHtml = `<div style="font-size:2.5rem;">📝</div>`;
                } else if (cat.especial === 'qrCode') {
                    logoHtml = `<div style="font-size:2.5rem;">📱</div>`;
                } else {
                    logoHtml = `<img src="${cat.logo}" alt="${cat.nome}" class="logo-mini" />`;
                }
                card.innerHTML = `
                    ${logoHtml}
                    <div class="titulo">${cat.nome}</div>
                    <div class="subtitulo">${cat.tituloImpressao}</div>
                `;
                card.addEventListener('click', () => abrirModal(cat));
                grade.appendChild(card);
            });
        }

        function atualizarHelper() {
            const tipo = qrTipo.value;
            if (tipo === 'whatsapp') {
                qrValor.placeholder = 'Ex: 11999999999';
                qrHelper.textContent = 'WhatsApp: número com DDD (apenas dígitos)';
            } else if (tipo === 'link') {
                qrValor.placeholder = 'Ex: google.com';
                qrHelper.textContent = 'Link: endereço do site (https adicionado)';
            } else if (tipo === 'pix') {
                qrValor.placeholder = 'Ex: 11999999999, email@dom, 123.456.789-00';
                qrHelper.textContent = 'Pix: telefone, email ou CPF/CNPJ';
            }
        }

        function abrirModal(categoria) {
            categoriaSelecionada = categoria;
            modalLogo.src = categoria.logo || 'logo.png';
            modalNomeEvento.textContent = categoria.nome;
            inputNome.value = '';
            inputTelefone.value = '';
            qrValor.value = '';
            qrOptions.style.display = 'none';
            campoNome.classList.remove('oculto');
            campoTelefone.classList.remove('oculto');

            if (categoria.especial === 'qrCode') {
                campoNome.classList.add('oculto');
                campoTelefone.classList.add('oculto');
                qrOptions.style.display = 'block';
                qrTipo.value = 'whatsapp';
                atualizarHelper();
            }
            modal.classList.add('aberto');
            if (!campoNome.classList.contains('oculto')) {
                inputNome.focus();
            } else {
                qrValor.focus();
            }
        }

        function fecharModal() {
            modal.classList.remove('aberto');
            categoriaSelecionada = null;
        }

        function acaoImprimir() {
            if (!categoriaSelecionada) {
                mostrarToast('Selecione uma categoria.', 'error');
                return;
            }
            const opts = {};
            if (categoriaSelecionada.especial === 'semLogo') {
                const nome = inputNome.value.trim();
                const telefone = inputTelefone.value.trim();
                if (!nome) { mostrarToast('Digite o nome.', 'error');
                    inputNome.focus(); return; }
                opts.semLogo = true;
                imprimirEtiqueta(nome, telefone, opts);
            } else if (categoriaSelecionada.especial === 'qrCode') {
                const tipo = qrTipo.value;
                const valor = qrValor.value.trim();
                if (!valor) { mostrarToast('Preencha o valor.', 'error');
                    qrValor.focus(); return; }
                opts.qrData = { tipo, valor };
                opts.titulo = categoriaSelecionada.tituloImpressao || 'QR Code';
                imprimirEtiqueta('', '', opts);
            } else {
                const nome = inputNome.value.trim();
                const telefone = inputTelefone.value.trim();
                if (!nome) { mostrarToast('Digite o nome.', 'error');
                    inputNome.focus(); return; }
                opts.logoUrl = categoriaSelecionada.logo || 'logo.png';
                opts.titulo = categoriaSelecionada.tituloImpressao || '';
                imprimirEtiqueta(nome, telefone, opts);
            }
        }

        // Eventos
        fecharModalBtn.addEventListener('click', fecharModal);
        cancelarBtn.addEventListener('click', fecharModal);
        imprimirBtn.addEventListener('click', acaoImprimir);
        modal.addEventListener('click', (e) => { if (e.target === modal) fecharModal(); });
        qrTipo.addEventListener('change', atualizarHelper);

        inputNome.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (!campoTelefone.classList.contains('oculto')) {
                    inputTelefone.focus();
                } else {
                    acaoImprimir();
                }
            }
        });
        inputTelefone.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault();
                acaoImprimir(); }
        });
        qrValor.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault();
                acaoImprimir(); }
        });

        renderizarCards();
        console.log('✅ Etiquetas carregado.');
    </script>

</body>
</html>
